<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학원 버스 타임매니저 🚌</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <header>
    <h1><i class="fa-solid fa-bus-simple"></i> 학원 버스 타임매니저</h1>
  </header>

  <div class="card timer-card">
    <div class="timer-title" id="statusTitle">⏰ 계산 대기 중</div>
    <div class="timer-display" id="countdownDisplay">00분 00초</div>
    <div class="timer-info" id="leaveTimeInfo">출발 권장 시간: 계산 중...</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="academyTime"><i class="fa-regular fa-clock"></i> 학원 도착 목표 시간</label>
      <input type="time" id="academyTime" value="17:00">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="busNumber"><i class="fa-solid fa-bus-sharp"></i> 버스 번호</label>
        <input type="text" id="busNumber" placeholder="예: 100 또는 500-1" value="100">
      </div>
      <div class="form-group">
        <label for="busStop"><i class="fa-solid fa-location-dot"></i> 탑승 정류장</label>
        <input type="text" id="busStop" placeholder="예: 강남역정류장" value="주공아파트 정류장">
      </div>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label for="walkToStop"><i class="fa-solid fa-person-walking"></i> 집 → 정류장 (도보 분)</label>
        <input type="number" id="walkToStop" value="5" min="1">
      </div>
      <div class="form-group">
        <label for="rideDuration"><i class="fa-solid fa-clock-rotate-left"></i> 정류장 → 학원 (탑승 분)</label>
        <input type="number" id="rideDuration" value="15" min="1">
      </div>
    </div>

    <button class="btn" id="btnUpdate"><i class="fa-solid fa-rotate"></i> 계산 및 정보 업데이트</button>
  </div>

  <div class="card">
    <div class="toggle-container">
      <label style="margin:0;"><i class="fa-solid fa-vial"></i> 모의 데이터(Dummy) 사용</label>
      <label class="switch">
        <input type="checkbox" id="dummyToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div id="apiConfig" style="display: none;" class="form-group">
      <label for="apiKey"><i class="fa-solid fa-key"></i> 공공데이터포털 API Key</label>
      <input type="text" id="apiKey" placeholder="ServiceKey 입력">
    </div>

    <label style="margin-top: 12px;"><i class="fa-solid fa-list-check"></i> 버스 도착 예정 현황</label>
    <div id="busList"></div>
  </div>
</div>

<div class="modal-overlay" id="alertModal">
  <div class="modal-content">
    <div class="modal-title"><i class="fa-solid fa-bell"></i> 출발 시간입니다!</div>
    <div class="modal-desc">
      버스를 3분 전 정류장에서 여유롭게 기다리려면<br><strong>지금 바로 집에서 나가세요!</strong>
    </div>
    <button class="btn" id="btnStopAlert" style="background-color: var(--accent-red); color: white;">확인 및 알림 끄기</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
